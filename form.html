<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formStylesheet.css">
    <title>Creator</title>

    <style>
        
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #dfb15b;
            margin-bottom: 20px;
        }

        #formBox {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1a1a1e;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #29292e;
        }

        .CharacterInfoBox {
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 1px solid #29292e;
        }

        .CharacterInfoBox h2 {
            color: #dfb15b;
            margin-top: 0;
            border-bottom: 2px solid #dfb15b;
            padding-bottom: 5px;
            font-size: 1.3rem;
        }

        #formCharacterInfoBox {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .characterInfoInput {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .characterInfoInput label {
            font-weight: bold;
            color: #e1e1e6;
        }

        .characterInfoInput input {
            background-color: #121214;
            border: 1px solid #29292e;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            width: 250px;
        }

        #formCharacterStatusBox {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .statusRow {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .statusLabel {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 150px;
        }

        .statusLabel label {
            font-weight: bold;
        }

        .statusRow input {
            background-color: #121214;
            border: 1px solid #29292e;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            width: 60px;
            text-align: center;
        }

        .columnLabel {
            width: 60px;
            text-align: center;
            font-size: 0.8rem;
            color: #a8a8b3;
            font-weight: bold;
        }

        #bottomSection {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            margin-top: 25px;
        }

        #equipmentSlotsGrid {
            display: grid;
            grid-template-columns: repeat(2, 70px);
            gap: 12px;
        }

        .slot {
            width: 70px;
            height: 70px;
            background-color: #29292e;
            border: 1px dashed #dfb15b;
            border-radius: 6px;
        }

        #extraInfoBox {
            flex-grow: 1;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .textareaGroup {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .textareaGroup label {
            font-size: 0.9rem;
            color: #dfb15b;
            font-weight: bold;
        }

        .textareaGroup textarea {
            background-color: #121214;
            border: 1px solid #29292e;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            resize: none;
        }
    </style>

</head>
<body>
    <h1>INSERT YOUR CHARACTER INFO</h1>
    
    <form action="#" id="formBox">
        
        <!-- SEÇÃO: CREATE CHARACTER -->
        <div class="CharacterInfoBox">
            <h2>CREATE CHARACTER</h2>
            <div id="formCharacterInfoBox">
                <div class="characterInfoInput">
                    <label for="name">Name:</label>
                    <input name="name" id="name" type="text">
                </div>
                <div class="characterInfoInput">
                    <label for="sex">Sex:</label>
                    <input name="sex" id="sex" type="text">
                </div>
                <div class="characterInfoInput">
                    <label for="class">Class:</label>
                    <input name="class" id="class" type="text">
                </div>
                <div class="characterInfoInput">
                    <label for="gift">Gift:</label>
                    <input name="gift" id="gift" type="text">
                </div>
                <div class="characterInfoInput">
                    <label for="health">Health:</label>
                    <input name="health" id="health" type="number">
                </div>
            </div>
        </div>

        <!-- SEÇÃO: CHARACTER STATUS -->
        <div class="CharacterInfoBox">
            <h2>CHARACTER STATUS</h2>
            <div id="formCharacterStatusBox">
                
                <!-- Linha do Level (Cabeçalho da tabela) -->
                <div class="statusRow headerRow">
                    <div class="statusLabel">
                        <img src="#" alt="icon">
                        <label for="level">LEVEL</label>
                    </div>
                    <input name="level" id="level" type="number">
                    <span class="columnLabel">MOD</span>
                    <span class="columnLabel">MOD+LEVEL</span>
                </div>

                <!-- Atributos principais com os campos adicionais da imagem -->
                <div class="statusRow">
                    <div class="statusLabel">
                        <img src="#" alt="icon">
                        <label for="vitality">VITALITY</label>
                    </div>
                    <input name="vitality" id="vitality" type="number">
                    <input name="vitalityMod" type="number">
                    <input name="vitalityModLevel" type="number">
                </div>

                <div class="statusRow">
                    <div class="statusLabel">
                        <img src="#" alt="icon">
                        <label for="strength">STRENGTH</label>
                    </div>
                    <input name="strength" id="strength" type="number">
                    <input name="strengthMod" type="number">
                    <input name="strengthModLevel" type="number">
                </div>

                <div class="statusRow">
                    <div class="statusLabel">
                        <img src="#" alt="icon">
                        <label for="dexterity">DEXTERITY</label>
                    </div>
                    <input name="dexterity" id="dexterity" type="number">
                    <input name="dexterityMod" type="number">
                    <input name="dexterityModLevel" type="number">
                </div>

                <div class="statusRow">
                    <div class="statusLabel">
                        <img src="#" alt="icon">
                        <label for="resistence">RESISTENCE</label>
                    </div>
                    <input name="resistence" id="resistence" type="number">
                    <input name="resistenceMod" type="number">
                    <input name="resistenceModLevel" type="number">
                </div>

                <div class="statusRow">
                    <div class="statusLabel">
                        <img src="#" alt="icon">
                        <label for="intelligence">INTELLIGENCE</label>
                    </div>
                    <input name="intelligence" id="intelligence" type="number">
                    <input name="intelligenceMod" type="number">
                    <input name="intelligenceModLevel" type="number">
                </div>

                <div class="statusRow">
                    <div class="statusLabel">
                        <img src="#" alt="icon">
                        <label for="faith">FAITH</label>
                    </div>
                    <input name="faith" id="faith" type="number">
                    <input name="faithMod" type="number">
                    <input name="faithModLevel" type="number">
                </div>

                <!-- Linha da Humanity (Rodapé da tabela) -->
                <div class="statusRow footerRow">
                    <div class="statusLabel">
                        <img src="#" alt="icon">
                        <label for="humanity">HUMANITY</label>
                    </div>
                    <input name="humanity" id="humanity" type="number">
                </div>

            </div>
        </div>

        <!-- SEÇÃO INFERIOR: SLOTS E TEXTOS (Lado a Lado) -->
        <div id="bottomSection">
            
            <!-- Blocos de Inventário/Equipamento (4 quadrados cinzas da esquerda) -->
            <div id="equipmentSlotsGrid">
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
            </div>

            <!-- Listas de Texto (Pergaminho da direita) -->
            <div id="extraInfoBox">
                <div class="textareaGroup">
                    <label for="spells">SPELLS:</label>
                    <textarea name="spells" id="spells" rows="4"></textarea>
                </div>
                
                <div class="textareaGroup">
                    <label for="equipment">EQUIPMENT:</label>
                    <textarea name="equipment" id="equipment" rows="4"></textarea>
                </div>
                
                <div class="textareaGroup">
                    <label for="items">ITEMS:</label>
                    <textarea name="items" id="items" rows="4"></textarea>
                </div>
            </div>

        </div>

    </form>
</body>
</html>
